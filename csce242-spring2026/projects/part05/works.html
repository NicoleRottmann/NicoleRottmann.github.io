            <div class="artifacts-search">
                <form class="search-bar artifacts-search-form" data-entity="collection">

                    <!-- Text input where user types -->

                </form>
            </div>



            <div class="artifacts-layout"> <!--Will hold sort/filter boxes and the gallery grid-->
                <aside class="sidebar">
                    <div class="sidebar-content">
                        <div class="box control-box" aria-expanded="false"> <!--SORT BOX-->
                            <div class="control-title" tabindex="0">SORT BY:</div>

                            <fieldset class="sort-group">
                                <div class="sort-option">
                                    <input type="radio" id="sort-default" name="sort" value="default" class="sort-input"
                                        checked>
                                    <label for="sort-default">Popularity</label>
                                </div>

                                <div class="sort-option">
                                    <input type="radio" id="sort-newest" name="sort" value="newest" class="sort-input">
                                    <label for="sort-newest">Newest</label>
                                </div>

                                <div class="sort-option">
                                    <input type="radio" id="sort-oldest" name="sort" value="az" class="sort-input">
                                    <label for="sort-oldest">Oldest</label>
                                </div>

                                <div class="sort-option">
                                    <input type="radio" id="sort-az" name="sort" value="az" class="sort-input">
                                    <label for="sort-az">A → Z</label>
                                </div>

                                <!-- add up to 3–6 options as needed -->
                            </fieldset>
                        </div>

                        <div class="box control-box" aria-expanded="false"> <!--FILTER BOX-->
                            <div class="control-title" tabindex="0">FILTER BY:</div>

                            <div class="filter-group" data-filter="medium">
                                <div id="filter-medium-heading" class="filter-subheading">Medium</div>

                                <div class="filter-options" data-limit="5">
                                    <div class="filter-option">
                                        <input type="checkbox" id="medium-oil" name="medium" value="oil"
                                            class="filter-checkbox">
                                        <label for="medium-oil">Oil</label>
                                    </div>

                                    <div class="filter-option">
                                        <input type="checkbox" id="medium-watercolor" name="medium" value="watercolor"
                                            class="filter-checkbox">
                                        <label for="medium-watercolor">Watercolor</label>
                                    </div>

                                    <div class="filter-option">
                                        <input type="checkbox" id="medium-acrylic" name="medium" value="acrylic"
                                            class="filter-checkbox">
                                        <label for="medium-acrylic">Acrylic</label>
                                    </div>

                                    <div class="filter-option">
                                        <input type="checkbox" id="medium-sculpture" name="medium" value="sculpture"
                                            class="filter-checkbox">
                                        <label for="medium-sculpture">Sculpture</label>
                                    </div>

                                    <div class="filter-option">
                                        <input type="checkbox" id="medium-print" name="medium" value="print"
                                            class="filter-checkbox">
                                        <label for="medium-print">Print</label>
                                    </div>

                                    <!-- See more button -->
                                    <button type="button" class="see-more-btn">
                                        see more...
                                    </button>
                                </div>


                            </div>

                            <div class="filter-group" data-filter="era">
                                <div id="filter-era-heading" class="filter-subheading">Era</div>

                                <div class="filter-options" data-limit="5">
                                    <div class="filter-option">
                                        <input type="checkbox" id="era-ancient" name="era" value="ancient"
                                            class="filter-checkbox">

                                    </div>
                                    <div class="filter-option">

                                        <label for="era-medieval">Medieval</label>
                                    </div>
                                    <div class="filter-option">
                                        <input type="checkbox" id="era-modern" name="era" value="modern"
                                            class="filter-checkbox">
                                        <label for="era-modern">Modern</label>
                                    </div>
                                    <div class="filter-option">
                                        <input type="checkbox" id="era-contemporary" name="era" value="contemporary"
                                            class="filter-checkbox">
                                        <label for="era-contemporary">Contemporary</label>
                                    </div>

                                    <button type="button" class="see-more-btn">
                                        see more...
                                    </button>
                                </div>
                            </div>


                            <div class="filter-group" data-filter="artist">
                                <div id="filter-era-heading" class="filter-subheading">Artist</div>


                                <form class="search-bar sidebar-mini-search" role="search">
                                    <input id="sidebar-artist-search" class="sidebar-mini-search-input" type="search"

                                    <button class="button sidebar-button" type="submit"
                                        class="sidebar-mini-search-submit">
                                        Go
                                    </button>
                                </form>

                            </div>

                                <div>
                                    <button type="button" class="button sidebar-button apply-filters">Apply</button>
                                    <button type="button" class="button sidebar-button clear-filters">Clear</button>
                                </div>
                            </div>
